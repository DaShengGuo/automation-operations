name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (core only, skip heavy AI)
        run: |
          python -m pip install --upgrade pip
          # Core dependencies only (skip torch/paddle for CI speed)
          pip install uiautomator2>=3.2.0 opencv-contrib-python>=4.6.0 Pillow>=10.0.0 numpy>=1.26.0 openpyxl>=3.1.0 Flask>=3.0.0 flask-socketio>=5.3.0 pytest>=8.0.0

      - name: Python syntax check
        run: |
          python -c "import glob, py_compile; [py_compile.compile(f, doraise=True) for f in glob.glob('**/*.py', recursive=True) if 'douyin-framework' not in f]"

      - name: Python import check
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          for mod in ['douyin_core.config','douyin_core.ocr_engine','comment_bot.fsm','comment_bot.scheduler','comment_bot.interrupt','comment_bot.materials','comment_bot.filter','comment_bot.persistence','device_profiles']:
              __import__(mod)
              print(f'  OK: {mod}')
          print('All imports OK')
          "
